<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Sketched portrait of Alex, traced from his headshot: long face, center-parted curtain hair
       to the jaw, maroon hoodie with a grey hood, dark tee, long bead chain. The features are
       swapped for a blob-style face: two tiny dot eyes set wide apart and a wide, flat smile. -->
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <pattern id="maroon" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#6e2233"/><circle cx="3" cy="3" r="1.1" fill="#541827"/></pattern>
    <pattern id="grey" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#c9ccd4"/><circle cx="2.5" cy="2.5" r="0.8" fill="#9ea3b2"/></pattern>
    <pattern id="hair" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#1a1b26"/><circle cx="2" cy="2" r="0.7" fill="#2e3044"/></pattern>
    <pattern id="skin" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fbf1e8"/><circle cx="3" cy="3" r="0.6" fill="#ecd6c6"/></pattern>
  </defs>
  <rect width="300" height="300" fill="#f3efe4"/>
  <g filter="url(#sk)" stroke="#22305a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- hoodie body and shoulders -->
    <path d="M-4 300 L-4 268 C20 250 70 236 104 230 L198 230 C232 236 280 250 304 266 L304 300 Z" fill="url(#maroon)"/>
    <!-- grey hood lining around the neck -->
    <path d="M100 226 C80 236 52 262 34 300 L76 300 C88 270 104 248 120 236 Z" fill="url(#grey)"/>
    <path d="M204 226 C226 234 256 248 268 266 C262 282 252 292 246 300 L212 300 C206 270 196 248 184 236 Z" fill="url(#grey)"/>
    <path d="M42 290 L80 252" stroke="#e6e7ec" stroke-width="2" fill="none"/>
    <!-- dark tee -->
    <path d="M118 234 C128 262 140 284 150 300 L206 300 C200 272 192 248 184 234 Z" fill="#20212c"/>
    <!-- neck -->
    <path d="M122 196 L120 236 C134 248 168 248 182 236 L182 196 Z" fill="url(#skin)"/>
    <!-- back hair: wide at the cheeks, ends at the jaw -->
    <path d="M78 150 C70 98 98 36 152 34 C206 34 236 96 230 150 C228 176 222 192 214 204 L206 208 L98 212 C90 202 82 186 78 150 Z" fill="url(#hair)"/>
    <!-- face: long, narrow chin -->
    <path d="M104 110 C104 58 200 58 200 110 L201 150 C200 192 176 222 152 224 C128 222 104 192 103 150 Z" fill="url(#skin)"/>
    <!-- curtain fringe from a centre part, sweeping down past the temples -->
    <path d="M150 50 C124 52 100 70 92 104 C86 134 88 170 96 208 C94 178 98 148 106 128 C110 118 116 108 124 100 C132 86 140 72 150 60 Z" fill="url(#hair)"/>
    <path d="M150 50 C178 52 204 70 212 104 C218 134 216 168 208 204 C210 176 206 148 198 128 C194 118 188 108 180 100 C172 86 164 72 152 60 Z" fill="url(#hair)"/>
    <path d="M150 46 L151 66" stroke="#3a3d58" stroke-width="1.6" fill="none"/>
    <!-- a few strands -->
    <path d="M132 70 C116 88 106 108 104 140 M170 70 C186 88 196 108 198 140 M92 120 C88 150 90 176 94 196" stroke="#3a3d58" stroke-width="1.2" fill="none"/>
  </g>
  <!-- long bead chain -->
  <path d="M124 228 C122 252 126 278 134 300 M180 228 C184 252 182 278 176 300" fill="none" stroke="#9aa0b4" stroke-width="2.4" stroke-dasharray="1.5 3" stroke-linecap="round"/>
  <!-- blob face: tiny dot eyes set wide apart, wide flat smile -->
  <g fill="#1a1b26">
    <ellipse cx="128" cy="142" rx="2.6" ry="3.4"/>
    <ellipse cx="176" cy="142" rx="2.6" ry="3.4"/>
  </g>
  <path d="M122 180 C134 188 170 188 182 180" fill="none" stroke="#1a1b26" stroke-width="2.2" stroke-linecap="round"/>
</svg>
